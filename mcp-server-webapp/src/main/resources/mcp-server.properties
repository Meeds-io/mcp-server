meeds.oauth.base-url=${exo.base.url:http://127.0.0.1:8080}

MEEDS_MCP_SERVER_CONTEXT=/mcp-server
MEEDS_OAUTH_SERVER_CONTEXT=/auth-server

meeds.oauth.server-base-url=${meeds.oauth.base-url}${MEEDS_OAUTH_SERVER_CONTEXT}
meeds.oauth.mcp-base-url=${meeds.oauth.base-url}${MEEDS_MCP_SERVER_CONTEXT}
meeds.oauth.mcp-server-url=${meeds.oauth.mcp-base-url}/mcp
meeds.oauth.mcp-server-protected-resource=${meeds.oauth.mcp-base-url}/.well-known/oauth-protected-resource

server.servlet.context-path=${MEEDS_MCP_SERVER_CONTEXT}
server.forward-headers-strategy=framework

spring.ai.mcp.client.enabled=false
spring.ai.mcp.server.enabled=true

spring.ai.mcp.server.name=${meeds.mcp.server.name:meeds-mcp}
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.request-timeout=360s
spring.ai.mcp.server.base-url=${MEEDS_MCP_SERVER_CONTEXT}
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.ai.mcp.server.tool-callback-converter=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.type=SYNC

spring.http.codecs.max-in-memory-size=10MB

spring.security.oauth2.resourceserver.jwt.issuer-uri=${meeds.oauth.server-base-url}
spring.security.oauth2.resourceserver.jwt.audiences=${meeds.oauth.mcp-server-url}

meeds.mcp.server.internal-client.registration.client-name=MCP Internal Client
meeds.mcp.server.internal-client.registration.client-id=mcp-internal
meeds.mcp.server.internal-client.registration.client-authentication-methods=client_secret_basic
meeds.mcp.server.internal-client.registration.authorization-grant-types=client_credentials
meeds.mcp.server.internal-client.registration.scopes=mcp.tools.read,mcp.tools.writeWithApproval

meeds.mcp.server.introspection-client.registration.client-name=MCP OAuth Resource Server
meeds.mcp.server.introspection-client.registration.client-id=mcp-introspection-client
meeds.mcp.server.introspection-client.registration.client-authentication-methods=client_secret_basic
meeds.mcp.server.introspection-client.registration.authorization-grant-types=client_credentials
meeds.mcp.server.opaquetoken.introspection-uri=${meeds.oauth.server-base-url}/oauth2/introspect
